<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Mini Content Engine</title><link rel="stylesheet" href="/styles.css"><link rel="stylesheet" href="/overrides.css"></head><body>
<main><header class="hero"><p class="eyebrow">GLITRAI TAKE-HOME</p><h1>Mini Content Engine</h1><p class="intro">Turn a product brief and reference into a creative-generation job.</p></header>
<section class="panel create-panel" aria-labelledby="create-title"><div class="panel-heading"><div><p class="section-kicker">NEW JOB</p><h2 id="create-title">Create a creative</h2></div><p class="helper">Add the essentials. An image is optional for this demo.</p></div><form id="generate-form"><label class="wide">Product name<input name="productName" required placeholder="Florentine Wooden Salad Bowl"></label><label class="wide">Short description<textarea name="description" required placeholder="Handpainted on mango wood, this compact salad bowl serves a supper for two."></textarea></label><label>Product image <span>Optional</span><input name="image" type="file" accept="image/*"></label><label>Image URL <span>Optional</span><input name="imageUrl" type="url" placeholder="https://example.com/product.jpg"></label><div class="form-action"><button>Generate creative <span aria-hidden="true">→</span></button><p id="form-message" role="status"></p></div></form></section>
<section class="jobs-section" aria-labelledby="jobs-title"><div class="section-head"><div><p class="section-kicker">ACTIVITY</p><h2 id="jobs-title">Jobs</h2></div><span id="storage"></span></div><div id="jobs" class="jobs"><p class="empty">No jobs yet. Create your first creative above.</p></div></section></main>
<template id="job-template"><article class="job"><div class="job-top"><div><p class="status"></p><h3></h3></div><time></time></div><p class="description"></p><ol class="pipeline" aria-label="Generation workflow"><li>Submit</li><li>Pending</li><li>Processing</li><li>Completed</li><li>Display image</li></ol><img class="result" alt="Generated creative"><details><summary>View generation prompt</summary><p class="prompt"></p></details><p class="error"></p></article></template><script src="/app.js"></script></body></html>
